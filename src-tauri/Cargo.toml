[package]
name = "latex-live"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "latex_live_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tex-fmt = "0.5.7"
tectonic = { path = "D:\\Coding\\Cloned\\contribute-tectonic", features = [
    "external-harfbuzz",
] }
tectonic_bundles = { path = "D:\\Coding\\Cloned\\contribute-tectonic\\crates\\bundles" }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
# `panic = "abort"` is intentionally not set: LaTeX formatting catches panics
# from `tex-fmt` so that a formatter bug cannot take down the editor.
strip = true

[package.metadata.vcpkg]
git = "https://github.com/microsoft/vcpkg"
branch = "master"
